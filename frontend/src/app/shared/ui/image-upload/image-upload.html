<div
  class="relative group"
  [class.w-full]="shape === 'square'"
  [class.w-28]="shape === 'rounded'"
  [class.h-28]="shape === 'rounded'"
>
  <!-- Image preview -->
  @if (currentUrl && !uploading()) {
    <div
      class="relative overflow-hidden border border-[var(--border-color)]"
      [class.rounded-2xl]="shape === 'square'"
      [class.rounded-full]="shape === 'rounded'"
      [class.h-40]="shape === 'square'"
      [class.h-28]="shape === 'rounded'"
    >
      <img
        [src]="currentUrl"
        alt="Imagen"
        class="w-full h-full object-cover"
      />
      <button
        type="button"
        (click)="removeImage()"
        class="absolute top-2 right-2 p-1 rounded-full bg-black/60 text-white opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"
      >
        <svg lucideX class="w-3.5 h-3.5"></svg>
      </button>
    </div>
  }

  <!-- Upload drop zone -->
  @if (!currentUrl && !uploading()) {
    <label
      class="flex flex-col items-center justify-center gap-2 border border-dashed cursor-pointer transition-colors"
      [class.rounded-2xl]="shape === 'square'"
      [class.rounded-full]="shape === 'rounded'"
      [class.h-40]="shape === 'square'"
      [class.h-28]="shape === 'rounded'"
      [class.border-[var(--border-color)]]="!dragOver()"
      [class.border-[var(--primary)]]="dragOver()"
      [class.bg-[var(--bg-tertiary)]]="!dragOver()"
      [class.bg-[var(--primary)]/5]="dragOver()"
      (drop)="onDrop($event)"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave()"
    >
      <svg lucideUpload class="w-5 h-5 text-[var(--text-muted)]"></svg>
      <span class="text-[10px] font-mono text-[var(--text-muted)]">
        @if (shape === 'square') {
          Arrastra o haz clic para subir
        } @else {
          Subir
        }
      </span>
      <input
        type="file"
        accept="image/jpeg,image/png,image/webp,image/gif"
        class="hidden"
        (change)="onFileSelected($event)"
      />
    </label>
  }

  <!-- Upload progress -->
  @if (uploading()) {
    <div
      class="flex flex-col items-center justify-center gap-2 border border-dashed border-[var(--border-color)] bg-[var(--bg-tertiary)]"
      [class.rounded-2xl]="shape === 'square'"
      [class.rounded-full]="shape === 'rounded'"
      [class.h-40]="shape === 'square'"
      [class.h-28]="shape === 'rounded'"
    >
      <svg lucideLoader class="w-5 h-5 text-[var(--primary)] animate-spin"></svg>
      <span class="text-[10px] font-mono text-[var(--text-muted)]">{{ progress() }}%</span>
    </div>
  }

  <!-- Error message -->
  @if (error()) {
    <p class="mt-1 text-[10px] font-mono text-rose-500">{{ error() }}</p>
  }
</div>
