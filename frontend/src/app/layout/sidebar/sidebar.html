<aside
  appSwipeDismiss
  direction="left"
  (dismiss)="store.closeSidebar()"
  [class]="
    'fixed inset-y-0 left-0 z-50 w-72 lg:relative lg:z-20 border-r border-[var(--border-color)] bg-[var(--bg-secondary)] flex-col justify-between shrink-0 h-full shadow-2xl lg:shadow-none lg:transition-all lg:duration-350 lg:ease-[cubic-bezier(0.34,1.56,0.64,1)] ' +
    (!isVisibleOnMobile() ? 'hidden lg:flex ' : 'flex ') +
    (isAnimatingIn() ? 'sidebar-animate-in ' : '') +
    (isAnimatingOut() ? 'sidebar-animate-out ' : '') +
    (desktopReady() ? 'sidebar-desktop-enter ' : 'lg:opacity-0 ') +
    (store.sidebarCollapsed()
      ? 'lg:w-20 lg:p-3 p-4 lg:overflow-visible overflow-y-auto no-scrollbar'
      : 'lg:w-64 p-4 lg:p-3 overflow-y-auto no-scrollbar')
  "
>
  <div class="space-y-6">
    <!-- Mobile header with app logo, title and close button (lg:hidden) -->
    <div class="flex items-center justify-between px-2 lg:hidden pb-3 border-b border-[var(--border-color)]">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-600 via-cyan-500 to-teal-400 p-0.5 flex items-center justify-center shadow-md shrink-0">
          <div class="w-full h-full bg-[var(--bg-secondary)] rounded-[10px] flex items-center justify-center">
            <svg lucideLayoutGrid class="w-4 h-4 text-cyan-500"></svg>
          </div>
        </div>
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="font-bold tracking-tight text-sm text-[var(--text-primary)] truncate">
            ICONS
          </span>
        </div>
      </div>
      <button
        type="button"
        (click)="store.closeSidebar()"
        class="p-1.5 rounded-lg bg-[var(--bg-tertiary)] hover:bg-[var(--border-color)] text-[var(--text-secondary)] hover:text-[var(--text-primary)] transition-colors cursor-pointer shrink-0"
        aria-label="Cerrar menú"
      >
        <svg lucideX class="w-4 h-4"></svg>
      </button>
    </div>

    <!-- Desktop Title & Collapse to Icon Mode Button -->
    <div
      class="hidden lg:flex items-center pb-3 border-b border-[var(--border-color)] relative h-11"
      [class]="store.sidebarCollapsed() ? 'justify-center' : 'justify-between px-1'"
    >
      <div
        class="overflow-hidden whitespace-nowrap transition-all duration-500 ease-in-out"
        [class]="store.sidebarCollapsed() ? 'max-w-0 opacity-0 pointer-events-none' : 'max-w-[160px] opacity-100'"
      >
        <p class="text-[10px] font-bold uppercase tracking-wider text-[var(--text-muted)] truncate">
          Módulos del Sistema
        </p>
      </div>

      <button
        type="button"
        (click)="store.toggleSidebarCollapsed()"
        class="w-8 h-8 rounded-xl bg-[var(--bg-tertiary)] hover:bg-cyan-500/15 hover:text-cyan-500 text-[var(--text-muted)] border border-[var(--border-color)] hover:border-cyan-500/30 transition-all duration-300 cursor-pointer shadow-xs flex items-center justify-center group relative shrink-0"
        [title]="store.sidebarCollapsed() ? '' : 'Contraer a modo iconos'"
        aria-label="Contraer/Expandir menú lateral"
      >
        @if (store.sidebarCollapsed()) {
          <svg lucideChevronRight class="w-4 h-4 text-cyan-500"></svg>
          <!-- Tooltip on Collapse Button -->
          <div
            role="tooltip"
            class="hidden lg:flex items-center gap-2 absolute left-full top-1/2 -translate-y-1/2 ml-3.5 px-3 py-2 rounded-xl bg-[var(--bg-card)] text-[var(--text-primary)] border border-[var(--border-color)] shadow-xl shadow-black/25 whitespace-nowrap z-[100] pointer-events-none opacity-0 group-hover:opacity-100 scale-95 group-hover:scale-100 transition-all duration-150 origin-left dark:border-cyan-500/30 dark:shadow-[0_0_20px_rgba(34,211,238,0.18),0_8px_20px_-4px_rgba(0,0,0,0.7)]"
          >
            <div
              class="absolute -left-1.5 top-1/2 -translate-y-1/2 w-3 h-3 rotate-45 bg-[var(--bg-card)] border-l border-b border-[var(--border-color)] dark:border-cyan-500/30"
            ></div>
            <span class="relative z-10 font-bold text-xs tracking-wide">Expandir Menú</span>
          </div>
        } @else {
          <svg lucideChevronLeft class="w-4 h-4"></svg>
        }
      </button>
    </div>

    <!-- Mobile Module section title -->
    <div class="px-3 lg:hidden">
      <p class="text-[10px] font-bold uppercase tracking-wider text-[var(--text-muted)]">
        Módulos del Sistema
      </p>
    </div>

    <!-- Navigation items -->
    <nav class="space-y-1.5">
      @for (item of menuItems; track item.id) {
        @let isActive = store.isViewActive(item.id);
        <button
          type="button"
          (click)="store.navigate(item.id)"
          [class]="
            'w-full h-11 flex items-center rounded-2xl text-xs font-medium transition-all duration-500 ease-in-out cursor-pointer group relative hover:z-30 ' +
            (store.sidebarCollapsed() ? 'lg:px-4 px-3' : 'px-3') +
            ' ' +
            (isActive
              ? 'border border-cyan-500/40 dark:border-cyan-400/30 text-[var(--text-primary)] font-semibold bg-transparent'
              : 'border border-transparent text-[var(--text-secondary)] hover:bg-[var(--bg-tertiary)] hover:text-[var(--text-primary)]')
          "
        >
          <!-- Active Line Indicator (pegado al borde del sidebar por fuera del tab) -->
          @if (isActive) {
            <span
              class="absolute top-1/2 -translate-y-1/2 w-1.5 h-6 bg-cyan-500 dark:bg-cyan-400 rounded-r-full shadow-[0_0_10px_rgba(6,182,212,0.85),0_0_22px_rgba(34,211,238,0.6)] z-20 pointer-events-none transition-all duration-300 -left-4 lg:-left-3"
              aria-hidden="true"
            ></span>
          }

          <div class="flex items-center min-w-0 w-full h-full">
            <!-- Icon wrapper with constant dimensions (nunca cambia de tamaño) -->
            <div class="w-6 h-6 shrink-0 flex items-center justify-center">
              <svg
                [lucideIcon]="item.icon"
                class="w-5 h-5 shrink-0 transition-colors duration-200"
                [class]="isActive ? 'text-cyan-500 dark:text-cyan-400' : 'text-[var(--text-muted)] group-hover:text-cyan-500'"
              ></svg>
            </div>

            <!-- Label and right badges wrapper (smooth horizontal collapse) -->
            <div
              class="flex-1 flex items-center justify-between min-w-0 overflow-hidden whitespace-nowrap transition-all duration-500 ease-in-out"
              [class]="store.sidebarCollapsed()
                ? 'lg:max-w-0 lg:opacity-0 lg:ml-0 pointer-events-none'
                : 'max-w-[200px] opacity-100 ml-3'"
            >
              <span class="truncate font-medium text-xs">{{ item.label }}</span>

              <div class="flex items-center gap-1.5 shrink-0 ml-2">
                @if (item.badge) {
                  <span
                    [class]="
                      'px-1.5 py-0.5 text-[10px] font-bold rounded-full ' +
                      (isActive
                        ? 'bg-cyan-500/15 text-cyan-500 dark:text-cyan-400 border border-cyan-500/30'
                        : 'bg-cyan-500/10 text-cyan-500 border border-cyan-500/20')
                    "
                  >
                    {{ item.badge }}
                  </span>
                }
                @if (item.highlight && !isActive) {
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                }
                @if (isActive) {
                  <svg lucideChevronRight class="w-3.5 h-3.5 text-cyan-500/80 dark:text-cyan-400/80"></svg>
                }
              </div>
            </div>
          </div>

          <!-- Small badge/highlight dot indicator when collapsed into icon mode (posición unificada) -->
          @if (store.sidebarCollapsed()) {
            @if (item.badge) {
              <span
                class="hidden lg:flex absolute top-2 right-2.5 w-2.5 h-2.5 rounded-full bg-cyan-400 ring-2 ring-[var(--bg-secondary)] z-10 pointer-events-none transition-all duration-300 animate-fade-in"
                aria-hidden="true"
              ></span>
            } @else if (item.highlight && !isActive) {
              <span
                class="hidden lg:flex absolute top-2 right-2.5 w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-[var(--bg-secondary)] z-10 pointer-events-none transition-all duration-300 animate-fade-in"
                aria-hidden="true"
              ></span>
            }
          }

          <!-- Floating custom tooltip on hover when in icon mode -->
          @if (store.sidebarCollapsed()) {
            <div
              role="tooltip"
              class="hidden lg:flex items-center gap-2 absolute left-full top-1/2 -translate-y-1/2 ml-3.5 px-3 py-2 rounded-xl bg-[var(--bg-card)] text-[var(--text-primary)] border border-[var(--border-color)] shadow-xl shadow-black/25 whitespace-nowrap z-[100] pointer-events-none opacity-0 group-hover:opacity-100 scale-95 group-hover:scale-100 transition-all duration-150 origin-left dark:border-cyan-500/30 dark:shadow-[0_0_20px_rgba(34,211,238,0.18),0_8px_20px_-4px_rgba(0,0,0,0.7)]"
            >
              <!-- Arrow pointer -->
              <div
                class="absolute -left-1.5 top-1/2 -translate-y-1/2 w-3 h-3 rotate-45 bg-[var(--bg-card)] border-l border-b border-[var(--border-color)] dark:border-cyan-500/30"
              ></div>

              <!-- Module Name -->
              <span class="relative z-10 font-bold text-xs tracking-wide">
                {{ item.label }}
              </span>

              <!-- Badge inside tooltip if present -->
              @if (item.badge) {
                <span
                  class="relative z-10 px-1.5 py-0.5 text-[10px] font-mono font-bold rounded-full bg-cyan-500/15 text-cyan-500 border border-cyan-500/30"
                >
                  {{ item.badge }}
                </span>
              }
              @if (item.highlight && !isActive) {
                <span
                  class="relative z-10 px-1.5 py-0.5 text-[9px] font-bold rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30"
                >
                  Nuevo
                </span>
              }
              @if (isActive) {
                <span class="relative z-10 w-1.5 h-1.5 rounded-full bg-cyan-500"></span>
              }
            </div>
          }
        </button>
      }
    </nav>

    <!-- Quick status box -->
    <div
      class="overflow-hidden transition-all duration-500 ease-in-out"
      [class]="store.sidebarCollapsed()
        ? 'max-h-0 opacity-0 pointer-events-none'
        : 'max-h-40 opacity-100'"
    >
      <div class="p-3.5 rounded-2xl bg-gradient-to-br from-cyan-500/10 via-sky-500/5 to-transparent border border-cyan-500/20">
        <div class="flex items-center gap-2 text-cyan-500 text-xs font-semibold mb-1">
          <svg lucideSparkles class="w-4 h-4"></svg>
          <span class="truncate">Infraestructura Sync</span>
        </div>
        <p class="text-[11px] text-[var(--text-muted)] leading-relaxed">
          v2.4.0 — Base de datos sincronizada en tiempo real (AES-256).
        </p>
      </div>
    </div>
  </div>

  <!-- Footer logout button -->
  <div class="pt-4 border-t border-[var(--border-color)]">
    <button
      type="button"
      (click)="store.navigate('welcome')"
      [class]="
        'w-full h-11 flex items-center rounded-2xl text-xs font-medium text-[var(--text-secondary)] hover:text-rose-500 hover:bg-rose-500/10 border border-transparent hover:border-rose-500/20 transition-all duration-500 ease-in-out cursor-pointer group relative hover:z-30 ' +
        (store.sidebarCollapsed() ? 'lg:px-4 px-3' : 'px-3')
      "
      [title]="store.sidebarCollapsed() ? '' : 'Cerrar Sesión'"
    >
      <div class="flex items-center min-w-0 w-full h-full">
        <div class="w-6 h-6 shrink-0 flex items-center justify-center">
          <svg lucideLogOut class="w-5 h-5 text-[var(--text-muted)] group-hover:text-rose-500 transition-colors shrink-0"></svg>
        </div>
        <div
          class="flex-1 flex items-center justify-between min-w-0 overflow-hidden whitespace-nowrap transition-all duration-500 ease-in-out"
          [class]="store.sidebarCollapsed()
            ? 'lg:max-w-0 lg:opacity-0 lg:ml-0 pointer-events-none'
            : 'max-w-[200px] opacity-100 ml-3'"
        >
          <span class="truncate group-hover:translate-x-0.5 transition-transform">
            Cerrar Sesión
          </span>
          <span class="text-[10px] text-[var(--text-muted)] group-hover:text-rose-400 shrink-0 ml-2">
            Salir
          </span>
        </div>
      </div>

      <!-- Tooltip on hover when in icon mode -->
      @if (store.sidebarCollapsed()) {
        <div
          role="tooltip"
          class="hidden lg:flex items-center gap-2 absolute left-full top-1/2 -translate-y-1/2 ml-3.5 px-3 py-2 rounded-xl bg-[var(--bg-card)] text-rose-500 border border-[var(--border-color)] shadow-xl shadow-black/25 whitespace-nowrap z-[100] pointer-events-none opacity-0 group-hover:opacity-100 scale-95 group-hover:scale-100 transition-all duration-150 origin-left dark:border-rose-500/30 dark:shadow-[0_0_20px_rgba(244,63,94,0.18),0_8px_20px_-4px_rgba(0,0,0,0.7)]"
        >
          <div
            class="absolute -left-1.5 top-1/2 -translate-y-1/2 w-3 h-3 rotate-45 bg-[var(--bg-card)] border-l border-b border-[var(--border-color)] dark:border-rose-500/30"
          ></div>
          <span class="relative z-10 font-bold text-xs tracking-wide">Cerrar Sesión</span>
        </div>
      }
    </button>
  </div>
</aside>
