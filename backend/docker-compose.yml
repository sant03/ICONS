services:
  mysql:
    image: mysql:8.4
    container_name: icons-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: icons
      MYSQL_USER: icons
      MYSQL_PASSWORD: icons
    volumes:
      - icons-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: icons-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  s3mock:
    image: adobe/s3mock:latest
    container_name: icons-s3mock
    ports:
      - "9000:9090"   # S3 API
    environment:
      - com.adobe.testing.s3mock.store.initial-buckets=icons
      - com.adobe.testing.s3mock.store.retain-files-on-exit=true
      - com.adobe.testing.s3mock.store.root=/s3mockroot
    volumes:
      - icons-s3-data:/s3mockroot

volumes:
  icons-mysql-data:
  icons-s3-data:
