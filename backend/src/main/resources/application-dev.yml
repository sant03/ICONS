spring:
  datasource:
    url: jdbc:mysql://localhost:3306/icons?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: icons
    password: icons
    hikari:
      maximum-pool-size: 10

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

icons:
  storage:
    endpoint: http://localhost:9000
    region: us-east-1
    bucket: icons
    access-key: minioadmin
    secret-key: minioadmin
    public-url: http://localhost:9000/icons

logging:
  level:
    com.plastyfreddy.icons: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
