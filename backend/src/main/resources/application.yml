spring:
  application:
    name: icons

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never

icons:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-key-change-in-production-must-be-at-least-256-bits-long!!}
      access-token-expiration: 15m
      refresh-token-expiration: 7d
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://192.168.*:4200}
    auth:
      max-failed-attempts: 5
      lockout-duration: 15m
    rate-limit:
      auth-requests-per-minute: 10

  tenant:
    default-slug: plastyfreddy

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /docs/api
  swagger-ui:
    path: /docs/swagger
    tags-sorter: alpha
    operations-sorter: alpha
