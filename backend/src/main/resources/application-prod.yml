spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    clean-disabled: true

  jpa:
    show-sql: false

icons:
  security:
    jwt:
      secret: ${JWT_SECRET}
    cors:
      allowed-origins: ${CORS_ORIGINS}

logging:
  level:
    com.plastyfreddy.icons: INFO
    org.springframework.security: WARN
